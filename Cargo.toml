[package]
name = "gpui-terminal"
version = "0.2.1"
edition = "2024"
license = "MIT"
authors = ["Paul Schifferer <paul@schifferers.net>"]
repository = "https://github.com/pilgrimagesoftware/gpui-terminal"
rust-version = "1.98"
description = "A terminal emulator view for GPUI, backed by alacritty_terminal, over any byte transport"
readme = "README.md"
keywords = ["gpui", "terminal", "pty", "alacritty", "tui"]
categories = ["gui", "command-line-interface"]

[features]
default = ["pty"]
# A local pseudo-terminal transport. Off for an embedder whose bytes come from
# somewhere else (a remote exec, a serial line) and that has no use for
# `portable-pty` in its build.
pty = ["dep:portable-pty", "dep:libc"]

[dependencies]
alacritty_terminal = "0.26.0"
# Wakes the view's pump when a transport thread delivers output. Executor-
# agnostic, so it works on GPUI's foreground executor without pulling in a
# runtime; already in the lockfile through GPUI.
async-channel = "2.5"
# No default features: the view uses core GPUI only, not the component
# library or the bundled assets. Bump together with consumers' pin - two
# `gpui` versions in one build are two incompatible `Entity` types.
gpui-kit = { version = "=0.7.0", default-features = false }
parking_lot = "0.12.5"
portable-pty = { version = "0.9.0", optional = true }
thiserror = "2.0.20"

# Hanging up a PTY child's whole process group on teardown (`pty::hangup`).
# Already in the lockfile through portable-pty; pinned to that same version.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.190", optional = true }

[dev-dependencies]
# GPUI's headless test platform, to drive the view's pump, layout and input
# without a display.
gpui-kit = { version = "=0.7.0", default-features = false, features = ["test-support"] }
tempfile = "3.27"
